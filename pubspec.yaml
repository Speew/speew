name: speew_mvp
description: Speew - Ultimate Secure P2P Messaging App with Advanced Features
publish_to: 'none'
version: 6.2.0+62

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # ============================================
  # CORE - State Management & Architecture
  # ============================================
  provider: ^6.1.2
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  
  # ============================================
  # NETWORKING - P2P & WebRTC
  # ============================================
  nearby_connections: ^4.0.0
  flutter_webrtc: ^0.11.7
  dio: ^5.7.0
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  
  # ============================================
  # STORAGE - Database & Cache
  # ============================================
  sqflite: ^2.3.3+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  drift: ^2.20.3
  
  # ============================================
  # SECURITY - Cryptography
  # ============================================
  crypto: ^3.0.5
  cryptography: ^2.7.0
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  
  # ============================================
  # UI & DESIGN
  # ============================================
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  animations: ^2.0.11
  
  # ============================================
  # MEDIA - Images, Audio, Video
  # ============================================
  image_picker: ^1.1.2
  image: ^4.2.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  photo_view: ^0.15.0
  just_audio: ^0.9.40
  audioplayers: ^6.1.0
  video_player: ^2.9.1
  camera: ^0.11.0+2
  flutter_sound: ^9.11.3
  
  # ============================================
  # LOCATION & MAPS
  # ============================================
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  google_maps_flutter: ^2.9.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  
  # ============================================
  # FILES & DOCUMENTS
  # ============================================
  file_picker: ^8.1.2
  path: ^1.9.0
  open_filex: ^4.5.0
  permission_handler: ^11.3.1
  archive: ^3.6.1
  mime: ^1.0.6
  
  # ============================================
  # NOTIFICATIONS & BACKGROUND
  # ============================================
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.5.2
  
  # ============================================
  # UTILS & HELPERS
  # ============================================
  intl: ^0.19.0
  uuid: ^4.5.1
  rxdart: ^0.28.0
  collection: ^1.18.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  
  # ============================================
  # QR CODE & BARCODE
  # ============================================
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  
  # ============================================
  # CHARTS & VISUALIZATION
  # ============================================
  fl_chart: ^0.69.0
  syncfusion_flutter_charts: ^27.1.58
  
  # ============================================
  # CONTACTS & SHARING
  # ============================================
  flutter_contacts: ^1.1.9+2
  share_plus: ^10.0.2
  
  # ============================================
  # DEVICE & SYSTEM
  # ============================================
  url_launcher: ^6.3.1
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  battery_plus: ^6.0.3
  
  # ============================================
  # BIOMETRICS & AUTH
  # ============================================
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  
  # ============================================
  # CODE GENERATION
  # ============================================
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # ============================================
  # FIREBASE (Optional)
  # ============================================
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  
  # ============================================
  # ERROR TRACKING
  # ============================================
  sentry_flutter: ^8.9.0
  
  # ============================================
  # WEB SCRAPING & HTML
  # ============================================
  html: ^0.15.4
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # ============================================
  # LINTING & CODE QUALITY
  # ============================================
  flutter_lints: ^5.0.0
  very_good_analysis: ^6.0.0
  custom_lint: ^0.6.7
  
  # ============================================
  # CODE GENERATION
  # ============================================
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  drift_dev: ^2.20.3
  
  # ============================================
  # TESTING
  # ============================================
  mockito: ^5.4.4
  bloc_test: ^9.1.7
  integration_test:
    sdk: flutter
  patrol: ^3.13.0
  
  # ============================================
  # ICONS & LAUNCHER
  # ============================================
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# ============================================
# DEPENDENCY OVERRIDES (Fix Conflicts)
# ============================================
dependency_overrides:
  web: ^1.0.0
  collection: ^1.18.0
  meta: ^1.15.0

# ============================================
# FLUTTER CONFIGURATION
# ============================================
flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
    - assets/fonts/
  
  # Fonts
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
    
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600

# ============================================
# FLUTTER LAUNCHER ICONS
# ============================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

# ============================================
# FLUTTER NATIVE SPLASH
# ============================================
flutter_native_splash:
  color: "#2196F3"
  image: assets/images/splash_logo.png
  android: true
  ios: true
  web: false
