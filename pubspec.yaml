name: speew
description: P2P Offline Messaging App - Refactored MVP
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # P2P Communication
  nearby_connections: ^4.3.0 # Version Downgraded
  
  # Security
  cryptography: ^2.5.0
  
  # Utils
  uuid: ^4.2.1
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  connectivity_plus: ^7.0.0
  get_it: ^9.2.0
  crypto: ^3.0.7
  image: ^4.7.2
  battery_plus: ^7.0.0
  device_info_plus: ^12.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^20.0.0
  flutter_webrtc: ^1.3.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
