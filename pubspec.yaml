name: speew_mvp
description: Speew MVP - App de mensagens P2P offline simples e funcional
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Networking P2P
  nearby_connections: ^3.3.0
  
  # Criptografia
  cryptography: ^2.7.0
  
  # State Management
  provider: ^6.1.1
  
  # Storage
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Permissões
  permission_handler: ^11.3.1
  
  # UUID
  uuid: ^4.3.3
  
  # Formatação de datas
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
